name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify server
        run: |
          set -euo pipefail
          python -m pip install uv
          uv sync --extra dev --frozen
          uv run pytest -q

      - name: Prepare SSH
        env:
          SSH_HOST: ${{ secrets.CLAW_SSH_HOST }}
          SSH_PORT: ${{ secrets.CLAW_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.CLAW_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_PRIVATE_KEY"
          SSH_PORT="${SSH_PORT:-22}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/claw_deploy_key
          chmod 600 ~/.ssh/claw_deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on claw
        env:
          SSH_HOST: ${{ secrets.CLAW_SSH_HOST }}
          SSH_PORT: ${{ secrets.CLAW_SSH_PORT }}
          SSH_USER: ${{ secrets.CLAW_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          SSH_PORT="${SSH_PORT:-22}"

          ssh -i ~/.ssh/claw_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/.local/share/mcp-surveys"

          if [ "$(git branch --show-current)" != "main" ]; then
            echo "Refusing to deploy from a branch other than main" >&2
            git status --short --branch >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "Refusing to deploy over production changes" >&2
            git status --short >&2
            exit 1
          fi

          git pull --ff-only origin main

          compose=(docker compose -p mcp-surveys -f compose.yaml -f compose.server.yaml)
          if ! "${compose[@]}" up -d --build --wait --wait-timeout 180; then
            "${compose[@]}" logs --no-color --tail=100 app
            exit 1
          fi

          "${compose[@]}" ps
          curl --noproxy '*' -fsS http://127.0.0.1:18173/health
          echo
          curl --noproxy '*' -fsS https://mcp.voevoda-sailing.ru/health
          echo
          REMOTE
